# === Microarchitecture Experiments Config (custom to your code layout) ===
sim_path: "sim"
traces:
  - "traces/gcc_trace.txt"

arg_order: ["BLOCKSIZE","L1_SIZE","L1_ASSOC","L2_SIZE","L2_ASSOC","PREF_N","PREF_M","TRACE"]

cacti_params:
  HTL1_ns: 0.27125
  HTL2_ns: 0.458925
  Miss_Penalty_ns: 20.1

experiments:
  graph1: true
  graph2: true
  graph3: true
  graph4: true
  graph5: true

graph1:
  blocksize: 32
  l1_sizes_kb: [1,2,4,8,16,32,64,128,256,512,1024]
  l1_assoc_list: [1,2,4,8,"FA"]
  l2_size_kb: 0
  l2_assoc: 0
  prefetch: [0,0]

graph2:
  blocksize: 32
  l1_sizes_kb: [1,2,4,8,16,32,64,128,256,512,1024]
  l1_assoc_list: [1,2,4,8]
  l2_size_kb: 0
  l2_assoc: 0
  prefetch: [0,0]

graph3:
  blocksize: 32
  l1_sizes_kb: [1,2,4,8]
  l1_assoc_list: [1,2,4,8]
  l2_size_kb: 16
  l2_assoc: 8
  prefetch: [0,0]

graph4:
  l1_sizes_kb: [1,2,4,8,16,32]
  l1_assoc: 4
  blocksizes: [16,32,64,128]
  l2_size_kb: 0
  l2_assoc: 0
  prefetch: [0,0]

graph5:
  blocksize: 32
  l1_sizes_kb: [1,2,4,8]
  l1_assoc: 4
  l2_sizes_kb: [16,32,64]
  l2_assoc: 8
  prefetch: [0,0]

precomputed_results_csv: ""
